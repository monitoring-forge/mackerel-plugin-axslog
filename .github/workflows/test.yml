name: test
on:
  push:
    branches:
      - "**"
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v4
        with:
          go-version-file: go.mod

      - name: test
        run: |
          make check
          make bench
        env:
          CGO_ENABLED: 1

      - name: Snapshot GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: latest
          args: build --snapshot
        env:
          CGO_ENABLED: 0

  test_simd:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOAMD64: v3
      GOEXPERIMENT: simd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v4
        with:
          go-version: 1.27.x

      - name: test simd
        run: |
          make check
          make bench
        env:
          CGO_ENABLED: 1
